[project]
name = "semabridge"
version = "1.0.0"
description = "Automate Fabric Power BI semantic model generation from Snowflake metadata"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "MIT"}
authors = [
    {name = "Platform Engineering Team"}
]
keywords = ["fabric", "power-bi", "snowflake", "semantic-model", "sml"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "snowflake-connector-python>=3.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "httpx>=0.25.0",
    "msal>=1.24.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "duckdb>=0.9.0",
    "PyQt6>=6.6.0",
    "tenacity>=8.2.0",
    "ruamel-yaml>=0.19.1",
    "sqlalchemy>=2.0.0",
    "duckdb-engine>=0.11.0",
]

[project.optional-dependencies]
llm = []
distributed = [
    "temporalio>=1.7.0",
    "ray[default]>=2.40.0",
    "psycopg2-binary>=2.9.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "prometheus-client>=0.20.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pyinstaller>=6.0.0",
    "temporalio>=1.7.0",
    "ray[default]>=2.40.0",
]

[project.scripts]
semabridge = "semabridge.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semabridge"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"

[dependency-groups]
dev = ["pyinstaller>=6.0.0"]
